name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install ruff
    - name: Compile check
      run: python -m py_compile bot.py storage.py pubg_api.py
    - name: Lint with ruff
      run: ruff check --select F .
    - name: Run smoke tests
      run: python test_smoke.py
    - name: Run cache tests
      run: python test_cache.py
    - name: Run translation tests
      run: python test_translations.py
    - name: Run empty state tests
      run: python test_empty_states.py
    - name: Run history tests
      run: python test_history.py
    - name: Run pytest
      run: pytest tests/ -v
